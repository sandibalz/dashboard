<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Health log</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f2; --ink:#17211f; --ink2:#53605c; --ink3:#7b8783; --rule:#d9ded8; --grid:#e6e9e4; --cell:#e9ece7;
  --c-steps:#2a78d6; --c-move:#eb6834; --c-ex:#1baf7a; --c-stand:#6250d6; --c-hr:#e34948; --c-hrv:#008300;
  --c-weight:#2a78d6; --c-sleep:#6250d6; --c-food:#eb6834; --c-other:#8a948f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#101514; --ink:#e8ece9; --ink2:#a9b4af; --ink3:#7f8b86; --rule:#27302d; --grid:#1d2523; --cell:#1c2321;
    --c-steps:#3987e5; --c-move:#d95926; --c-ex:#199e70; --c-stand:#9085e9; --c-hr:#e66767; --c-hrv:#2f9a2f;
    --c-weight:#3987e5; --c-sleep:#9085e9; --c-food:#d95926; --c-other:#6f7a75;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101514; --ink:#e8ece9; --ink2:#a9b4af; --ink3:#7f8b86; --rule:#27302d; --grid:#1d2523; --cell:#1c2321;
  --c-steps:#3987e5; --c-move:#d95926; --c-ex:#199e70; --c-stand:#9085e9; --c-hr:#e66767; --c-hrv:#2f9a2f;
  --c-weight:#3987e5; --c-sleep:#9085e9; --c-food:#d95926; --c-other:#6f7a75;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:70px}
body{margin:0;color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-steps);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;left:-9999px}

/* top bar */
#bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
#bar .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-top:10px;padding-bottom:10px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink3)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lnk{border:0;background:none;padding:0;color:var(--ink2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}

/* intro / drop */
.hero{padding:72px 0 40px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:0 0 18px;max-width:14ch}
.hero p{color:var(--ink2);max-width:56ch;margin:0 0 26px;font-size:16px}
.hero .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
body.drag .hero{outline:2px dashed var(--c-steps);outline-offset:14px;border-radius:12px}
.how{margin:38px 0 0;padding:0;list-style:none;display:grid;gap:14px;max-width:60ch;counter-reset:s}
.how li{counter-increment:s;padding-left:34px;position:relative;color:var(--ink2)}
.how li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:12px;color:var(--ink)}
.how b{color:var(--ink);font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;max-width:520px;margin:18px 0 10px}
.meter i{display:block;height:100%;width:0;background:var(--c-steps);transition:width .2s}
.err{color:var(--c-hr);max-width:60ch}

/* sections */
section{padding:34px 0 18px;border-top:1px solid var(--rule)}
section.first{border-top:0;padding-top:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
a.tile{display:block;border:1px solid var(--rule);border-radius:14px;padding:14px 16px 12px;color:var(--ink);text-decoration:none;background:var(--bg)}
a.tile:hover,a.tile:focus-visible{border-color:var(--ink3)}
a.tile .tl{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
a.tile .tv{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
a.tile .tv small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
a.tile .ts{font-size:12.5px;color:var(--ink3);min-height:18px}
a.tile svg{display:block;width:100%;height:30px;margin-top:8px}
h2{font-size:22px;letter-spacing:-.015em;font-weight:650;margin:0 0 4px}
.lede{color:var(--ink2);margin:0 0 22px;max-width:64ch;font-size:14.5px}
.meta{color:var(--ink3);font-size:13px;margin:6px 0 0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:22px 28px}
.stat .l{font-size:13px;color:var(--ink2)}
.stat .v{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.stat .v small{font-size:14px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:3px}
.stat .d{font-size:12.5px;color:var(--ink3)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:30px 40px}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.chead h3{margin:0;font-size:15px;font-weight:600}
.chead .sub{color:var(--ink3);font-size:12.5px;margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.plot{position:relative;width:100%}
.plot svg{display:block;width:100%;height:auto;overflow:visible}
.plot text{fill:var(--ink3);font-size:11px}
.note{color:var(--ink3);font-size:13px;padding:30px 0}
.tbl{max-height:240px;overflow:auto;border:1px solid var(--rule);border-radius:8px}
.tbl table{font-size:12.5px}

/* day view */
.dayview{display:grid;grid-template-columns:minmax(200px,230px) 1fr;gap:24px 40px;align-items:center}
@media (max-width:640px){.dayview{grid-template-columns:1fr}}
.daynav{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.daynav input[type=date]{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:4px 8px;font-size:13px}
.ringlist{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.ringlist li{display:grid;grid-template-columns:12px 1fr auto;gap:0 10px;align-items:baseline}
.ringlist i{width:12px;height:12px;border-radius:50%;align-self:center}
.ringlist .n{font-size:20px;font-weight:600;letter-spacing:-.02em}
.ringlist .n small{font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:0}
.ringlist .p{color:var(--ink2);font-size:13px}
.dayfacts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;color:var(--ink2);font-size:13.5px}
.dayfacts b{color:var(--ink);font-weight:600}
.daywk{margin-top:10px;font-size:13.5px;color:var(--ink2)}

/* heatmap */
.hm{overflow-x:auto;padding-bottom:6px}
.hm svg{display:block}
.hm text{fill:var(--ink3);font-size:10.5px}
.hm rect.c{cursor:pointer}
.hmbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hmbar select{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:13px}
.hmleg{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;margin-left:auto}
.hmleg i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* workouts */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--rule);padding:8px 10px;white-space:nowrap;position:sticky;top:0;background:var(--bg)}
th button{border:0;background:none;padding:0;font-weight:600;color:inherit;font-size:inherit}
th button:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);font-size:14px;white-space:nowrap}
td.num,th.num{text-align:right}
td small{color:var(--ink3);margin-left:6px}
.tablewrap{overflow-x:auto}
.more{margin:14px 0 0}

.in{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;min-width:0}
select.in{background:var(--bg)}
.in.num{width:96px}.in.wide{flex:1 1 220px}
.frow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 10px}
.foodadd{margin:24px 0 4px}
.foodadd input[type=search]{flex:1 1 260px}
.res{list-style:none;margin:0 0 6px;padding:0;border-top:1px solid var(--grid)}
.res button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid);background:none;padding:9px 4px}
.res button:hover{background:var(--grid)}
.res small,.pick small{color:var(--ink3)}
.rk{color:var(--ink2);white-space:nowrap}
.pick{border:1px solid var(--rule);border-radius:10px;padding:14px;margin:10px 0}
.pick label{font-size:13px;color:var(--ink2)}
.favs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;align-items:center}
.favrow{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--grid)}.favrow small{display:block;color:var(--ink3);font-size:12.5px}.favact{display:flex;gap:6px;flex:none}
.qtyc{white-space:nowrap}.qtyc button{border:1px solid var(--rule);background:none;border-radius:6px;width:24px;height:24px;line-height:1;padding:0;margin:0 2px}
.favchip{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.favchip button{border:0;background:none;padding:4px 10px;font-size:13px;color:var(--ink2)}
.favchip button:hover{color:var(--ink)}
tfoot td{font-weight:600;border-bottom:0}
.badge{display:inline-block;border:1px solid var(--c-ex);color:var(--c-ex);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.how2{margin:18px 0 0}.how2 summary{cursor:pointer;color:var(--ink2);font-size:13px}
.ver{color:var(--ink3);font-size:12px;white-space:nowrap}
.who{color:var(--ink2);font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{margin:16px 0 0;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;color:var(--ink2);font-size:13px}
footer{border-top:1px solid var(--rule);margin-top:40px;padding:22px 0 60px;color:var(--ink3);font-size:12.5px;max-width:78ch}
footer p{margin:0 0 8px}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:270px;display:none}
#tip b{font-weight:600}
#tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;border:1px solid color-mix(in srgb,var(--bg) 60%,transparent)}
#tip .r{display:flex;justify-content:space-between;gap:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="bar"><div class="wrap" id="barin"></div></header>
<main class="wrap" id="app"></main>
<input class="sr" type="file" id="file" accept=".zip,.xml,.json" tabindex="-1" aria-hidden="true">
<input class="sr" type="file" id="zipfile" accept=".zip" tabindex="-1" aria-hidden="true">
<div id="tip" role="tooltip"></div>

<script>
'use strict';
/* =====================================================================
   Health log — reads an Apple Health export on this computer.
   Health data is never uploaded. The only outside requests are the optional food searches (USDA FoodData Central, Open Food Facts), which send just the words you type.
   Layout of this script:
     1. helpers   2. export reader (zip + streaming XML)   3. model
     4. storage   5. charts   6. views   7. events
   The parsed result is a small "summary" object (one entry per day plus a
   list of workouts) — see finalize(). New panels read from that object.
   ===================================================================== */

/* ---------- 1. helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0 = x => Math.round(x).toLocaleString();
const n1 = x => (Math.round(x * 10) / 10).toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1});
const dnum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
const dstr = n => new Date(n * 864e5).toISOString().slice(0, 10);
const addDays = (s, n) => dstr(dnum(s) + n);
const weekStart = n => n - ((n + 3) % 7);               // Monday
const localDate = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const fmtDate = (s, o) => localDate(s).toLocaleDateString(undefined, o || {month: 'short', day: 'numeric', year: 'numeric'});
const mean = a => { let t = 0, c = 0; for (const v of a) if (v != null) { t += v; c++; } return c ? t / c : null; };
const tryDo = f => { try { return f(); } catch (e) { return null; } };

/* ---------- 2. export reader ---------- */
const MI = {mi: 1, km: .621371, m: .000621371, yd: 1 / 1760, ft: 1 / 5280};
const toMi = (v, u) => v * (MI[u] ?? 1);
const toKcal = (v, u) => u === 'kJ' ? v * .239006 : v;
const toLb = (v, u) => u === 'kg' ? v * 2.20462 : v;

function attr(a, k) {                                    // k like ' value="'
  const i = a.indexOf(k); if (i < 0) return '';
  return a.substring(i + k.length, a.indexOf('"', i + k.length));
}
function ts(s) {                                         // "2019-08-04 06:51:35 -0500" -> epoch ms
  const off = (s.charCodeAt(20) === 45 ? -1 : 1) * (+s.substr(21, 2) * 60 + +s.substr(23, 2));
  return Date.UTC(+s.substr(0, 4), +s.substr(5, 2) - 1, +s.substr(8, 2), +s.substr(11, 2), +s.substr(14, 2), +s.substr(17, 2)) - off * 6e4;
}

function newAgg() {
  return {steps: new Map(), dist: new Map(), basal: new Map(), sleep: new Map(), hr: new Map(), rhr: new Map(),
    whr: new Map(), hrv: new Map(), vo2: new Map(), diet: new Map(), act: new Map(), weights: [], workouts: [],
    hrT: [], hrV: [], hrk: new Map(), hrPrev: new Map(), profile: null, height: null, dT0: [], dT1: [], dV: [], dS: [], srcIds: new Map(), cur: null, exportDate: null, records: 0, tags: 0};
}
const bySrc = (m, d, s, v) => { let o = m.get(d); if (!o) m.set(d, o = {}); o[s] = (o[s] || 0) + v; };
const acc = (m, d, v) => { let o = m.get(d); if (!o) m.set(d, o = [0, 0]); o[0] += v; o[1]++; };

function onTag(A, tag, a) {
  A.tags++;
  switch (tag) {
    case 'Record': { A.records++; A.cur = null; return onRecord(A, a); }
    case 'Workout': {
      const dur = +attr(a, ' duration="'), du = attr(a, ' durationUnit="');
      const w = {
        type: attr(a, ' workoutActivityType="').replace('HKWorkoutActivityType', ''),
        s: attr(a, ' startDate="'), e: attr(a, ' endDate="'),
        min: du === 'sec' ? dur / 60 : du === 'hr' ? dur * 60 : dur,
        src: attr(a, ' sourceName="'), mi: null, kcal: null, hr: null, hrMax: null
      };
      const td = attr(a, ' totalDistance="'); if (td) w.mi = toMi(+td, attr(a, ' totalDistanceUnit="'));
      const te = attr(a, ' totalEnergyBurned="'); if (te) w.kcal = toKcal(+te, attr(a, ' totalEnergyBurnedUnit="'));
      A.workouts.push(w); A.cur = w; return;
    }
    case 'WorkoutStatistics': {
      const w = A.cur; if (!w) return;
      const t = attr(a, ' type="'), u = attr(a, ' unit="'), sum = attr(a, ' sum="');
      if (t === 'HKQuantityTypeIdentifierActiveEnergyBurned' && sum) w.kcal = toKcal(+sum, u);
      else if (t.startsWith('HKQuantityTypeIdentifierDistance') && sum) { if (w.mi == null) w.mi = toMi(+sum, u); }
      else if (t === 'HKQuantityTypeIdentifierHeartRate') { const av = attr(a, ' average="'); if (av) w.hr = +av; const mx = attr(a, ' maximum="'); if (mx) w.hrMax = +mx; }
      return;
    }
    case 'ActivitySummary': {
      A.cur = null;
      const d = attr(a, ' dateComponents="'); if (d < '2010') return;
      const g = k => +attr(a, ' ' + k + '="') || 0;
      A.act.set(d, {move: g('activeEnergyBurned'), moveGoal: g('activeEnergyBurnedGoal'), ex: g('appleExerciseTime'),
        exGoal: g('appleExerciseTimeGoal'), stand: g('appleStandHours'), standGoal: g('appleStandHoursGoal')});
      return;
    }
    case 'ExportDate': A.exportDate = attr(a, ' value="').slice(0, 10); return;
    case 'Me': {
      const sx = attr(a, ' HKCharacteristicTypeIdentifierBiologicalSex="'), dob = attr(a, ' HKCharacteristicTypeIdentifierDateOfBirth="').slice(0, 10);
      A.profile = {sex: /Female/.test(sx) ? 'female' : /Male/.test(sx) ? 'male' : null, dob: /^\d{4}-\d\d-\d\d$/.test(dob) ? dob : null};
      return;
    }
  }
}

function onRecord(A, a) {
  const type = attr(a, ' type="');
  switch (type) {
    case 'HKQuantityTypeIdentifierStepCount': {
      const v = +attr(a, ' value="'); if (v > 0) bySrc(A.steps, attr(a, ' startDate="').slice(0, 10), attr(a, ' sourceName="'), v); return;
    }
    case 'HKQuantityTypeIdentifierDistanceWalkingRunning': {
      const v = +attr(a, ' value="'); if (!(v > 0)) return;
      const sd = attr(a, ' startDate="'), src = attr(a, ' sourceName="'), mi = toMi(v, attr(a, ' unit="'));
      bySrc(A.dist, sd.slice(0, 10), src, mi);
      let id = A.srcIds.get(src); if (id === undefined) A.srcIds.set(src, id = A.srcIds.size);
      A.dT0.push(ts(sd)); A.dT1.push(ts(attr(a, ' endDate="'))); A.dV.push(mi); A.dS.push(id);   // kept so workouts can be matched to distance
      return;
    }
    case 'HKQuantityTypeIdentifierBasalEnergyBurned': {
      const v = +attr(a, ' value="'); if (v > 0) bySrc(A.basal, attr(a, ' startDate="').slice(0, 10), attr(a, ' sourceName="'), toKcal(v, attr(a, ' unit="'))); return;
    }
    case 'HKQuantityTypeIdentifierHeartRate': {
      const v = +attr(a, ' value="'); if (!(v > 0)) return;
      const sd = attr(a, ' startDate="'), d = sd.slice(0, 10);
      let o = A.hr.get(d); if (!o) A.hr.set(d, o = [0, 0, 1e9, 0]);
      o[0] += v; o[1]++; if (v < o[2]) o[2] = v; if (v > o[3]) o[3] = v;
      const t = ts(sd), src = attr(a, ' sourceName="'), pv = A.hrPrev.get(src);
      if (v >= 100 && pv !== undefined && t > pv) {                 // exercise-level heart rate: minutes and minutes x bpm, for the heart-rate energy estimate
        const dt = Math.min(t - pv, 3e5) / 6e4; let k = A.hrk.get(d); if (!k) A.hrk.set(d, k = [0, 0]); k[0] += dt; k[1] += dt * v;
      }
      if (pv === undefined || t > pv) A.hrPrev.set(src, t);
      A.hrT.push(t); A.hrV.push(v); return;
    }
    case 'HKQuantityTypeIdentifierHeight': {
      const v = +attr(a, ' value="'), u = attr(a, ' unit="'), t = ts(attr(a, ' startDate="')); if (!(v > 0)) return;
      const cm = u === 'ft' ? v * 30.48 : u === 'in' ? v * 2.54 : u === 'm' ? v * 100 : u === 'cm' ? v : 0;
      if (cm > 50 && cm < 260 && (!A.height || t >= A.height[0])) A.height = [t, cm]; return;
    }
    case 'HKQuantityTypeIdentifierRestingHeartRate': { const v = +attr(a, ' value="'); if (v > 0) acc(A.rhr, attr(a, ' startDate="').slice(0, 10), v); return; }

async function zipEntries(file) {
  const tl = Math.min(file.size, 70000);
  const tail = new DataView(await file.slice(file.size - tl).arrayBuffer());
  let e = -1;
  for (let i = tl - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('That file is not a readable .zip.');
  let cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  if (cdOff === 0xFFFFFFFF || cdSize === 0xFFFFFFFF) {
    const loc = e - 20;
    if (loc >= 0 && tail.getUint32(loc, true) === 0x07064b50) {
      const z = Number(tail.getBigUint64(loc + 8, true));
      const r = new DataView(await file.slice(z, z + 56).arrayBuffer());
      cdSize = Number(r.getBigUint64(40, true)); cdOff = Number(r.getBigUint64(48, true));
    }
  }
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
  const out = []; let p = 0;
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const method = cd.getUint16(p + 10, true);
    let cs = cd.getUint32(p + 20, true), us = cd.getUint32(p + 24, true), lho = cd.getUint32(p + 42, true);
    const nl = cd.getUint16(p + 28, true), el = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
    const name = new TextDecoder().decode(new Uint8Array(cd.buffer, cd.byteOffset + p + 46, nl));
    if (cs === 0xFFFFFFFF || us === 0xFFFFFFFF || lho === 0xFFFFFFFF) {
      let q = p + 46 + nl; const end = q + el;
      while (q + 4 <= end) {
        const id = cd.getUint16(q, true), sz = cd.getUint16(q + 2, true);
        if (id === 1) {
          let r = q + 4;
          if (us === 0xFFFFFFFF) { us = Number(cd.getBigUint64(r, true)); r += 8; }
          if (cs === 0xFFFFFFFF) { cs = Number(cd.getBigUint64(r, true)); r += 8; }
          if (lho === 0xFFFFFFFF) { lho = Number(cd.getBigUint64(r, true)); }
        }
        q += 4 + sz;

    out.push({name, method, cs, us, lho});

}
async function zipStream(file, ent) {
  const lh = new DataView(await file.slice(ent.lho, ent.lho + 30).arrayBuffer());
  const start = ent.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
  const raw = file.slice(start, start + ent.cs).stream();
  if (ent.method === 0) return raw;
  if (ent.method !== 8) throw new Error('This zip uses a compression method the page cannot read.');
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unzip files. Use a current Chrome, Edge, Safari or Firefox, or unzip the file and open export.xml.');
  return raw.pipeThrough(new DecompressionStream('deflate-raw'));

/* ---------- state ---------- */
const S = {model: null, range: '90', unit: Store.pref('unit') === 'km' ? 'km' : 'mi', day: null, year: 'last',
  type: 'all', sort: {k: 's', dir: -1}, shown: 25, tbl: {}, busy: null, error: null,

let M = null;
const charts = [];                                        // [{id, cfg}] re-drawn on resize

/* ---------- 5. charts ---------- */
const tip = $('#tip');
function showTip(html, x, y) {

}
const hideTip = () => { tip.style.display = 'none'; };

function niceStep(raw) {
  const mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;

}
function granFor(days) { return days <= 150 ? 'day' : days <= 900 ? 'week' : 'month'; }
function bucketKey(d, gran) { return gran === 'day' ? d : gran === 'week' ? dstr(weekStart(dnum(d))) : d.slice(0, 8) + '01'; }

/* bucket daily values for a field (or a function of the day) into day/week/month means */
function bucketed(days, gran, get, how = 'mean') {
  const labels = [], vals = []; let key = null, arr = null;
  const flush = () => { if (arr) vals.push(how === 'sum' ? (arr.length ? arr.reduce((p, c) => p + c, 0) : null) : how === 'last' ? (arr.length ? arr[arr.length - 1] : null) : mean(arr)); };

    const v = get(d); if (v != null) arr.push(v);

}
function rolling(vals, w = 7) {
  return vals.map((_, i) => { if (i < w - 1) return null; return mean(vals.slice(i - w + 1, i + 1)); });
}
const fld = f => d => M.daily[d]?.[f];

function tickLabel(l, gran, span) {
  if (gran === 'month' || span > 330) return fmtDate(l, {month: 'short', year: '2-digit'}).replace(' ', ' ’');

}
function tipTitle(l, gran) {

}
function barPath(x, y, w, h, r) {

  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function block(id, title, sub, series) {

  return `<div class="cblock"><div class="chead"><h3>${esc(title)}</h3><span class="sub">${esc(sub || '')}</span><button class="lnk" data-act="tbl" data-id="${id}">${S.tbl[id] ? 'Chart' : 'Table'}</button></div>${lg}<div class="plot" id="${id}"></div></div>`;
}
function mount(id, cfg) { charts.push({id, cfg}); drawChart(id, cfg); }

function drawChart(id, cfg) {
  const host = document.getElementById(id); if (!host) return;
  if (S.tbl[id]) { host.innerHTML = tableView(cfg); return; }
  const N = cfg.labels.length;
  if (!N || cfg.series.every(s => s.values.every(v => v == null))) { host.innerHTML = '<div class="note">No data in this range.</div>'; return; }
  const W = Math.max(300, host.clientWidth || 600), H = cfg.h || 210, m = {l: 48, r: 10, t: 10, b: 24};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  let hi = 0, lo = cfg.zero === false ? Infinity : 0;
  for (let i = 0; i < N; i++) {
    let st = 0;
    for (const s of cfg.series) { const v = s.values[i]; if (v == null) continue; if (s.stack) { st += v; hi = Math.max(hi, st); } else { hi = Math.max(hi, v); lo = Math.min(lo, v); } }
  }
  if (!isFinite(lo)) lo = 0;
  let step;
  if (cfg.zero === false) { const pad = Math.max((hi - lo) * .12, .5); lo -= pad; hi += pad; step = niceStep((hi - lo) / 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; }
  else { step = niceStep(Math.max(hi, 1e-9) / 4); hi = Math.ceil(hi / step) * step || step; }
  const y = v => m.t + ih - (v - lo) / (hi - lo) * ih;
  const band = iw / N, xc = i => m.l + band * (i + .5);
  const yf = cfg.yFmt || n0;
  let g = '';
  for (let t = lo; t <= hi + step / 2; t += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${yf(t)}</text>`;
  }
  const span = N * (cfg.gran === 'day' ? 1 : cfg.gran === 'week' ? 7 : 30);
  const nt = Math.min(N, W < 480 ? 4 : 6);
  for (let k = 0; k < nt; k++) {
    const i = nt === 1 ? 0 : Math.round(k * (N - 1) / (nt - 1));
    g += `<text x="${xc(i)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === nt - 1 ? 'end' : 'middle'}">${tickLabel(cfg.labels[i], cfg.gran, span)}</text>`;
  }
  const base = y(Math.max(lo, 0));
  const bw = Math.max(1.2, Math.min(band - (band > 6 ? 1.5 : .6), band * .74, 20));
  let marks = '', lines = '';
  const cum = new Array(N).fill(0), topIdx = [];
  const stackSeries = cfg.series.filter(s => s.stack);
  for (let i = 0; i < N; i++) { let t = -1; stackSeries.forEach((s, k) => { if (s.values[i] > 0) t = k; }); topIdx.push(t); }
  cfg.series.forEach(s => {
    if (s.type === 'bar') {
      let d = '';
      for (let i = 0; i < N; i++) {
        const v = s.values[i]; if (v == null || v <= 0) continue;
        let y0, y1;
        if (s.stack) { y0 = y(cum[i]); y1 = y(cum[i] + v); cum[i] += v; if (y0 - y1 > 3) y0 -= 1; } else { y0 = base; y1 = y(v); }
        const top = !s.stack || topIdx[i] === stackSeries.indexOf(s);
        d += barPath(xc(i) - bw / 2, y1, bw, y0 - y1, top ? 3 : 0);
      }

    } else {
      let d = '', pen = false;

        const v = s.values[i];
        if (v == null) { if (!s.connect) pen = false; continue; }
        d += (pen ? 'L' : 'M') + xc(i).toFixed(1) + ',' + y(v).toFixed(1); pen = true;
      }
      lines += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.thin ? 1.5 : 2}" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
      if (s.dots) for (let i = 0; i < N; i++) if (s.values[i] != null) lines += `<circle cx="${xc(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`;
    }

  const axis = cfg.zero === false ? '' : `<line x1="${m.l}" x2="${W - m.r}" y1="${base}" y2="${base}" stroke="var(--ink3)" stroke-width="1"/>`;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(cfg.title || '')}">${g}${axis}${marks}${lines}<line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink3)" stroke-width="1" style="display:none"/><g class="dots"></g><rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg = host.firstChild, hit = $('.hit', svg), xh = $('.xh', svg), dg = $('.dots', svg);
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = W / r.width;
    const i = Math.max(0, Math.min(N - 1, Math.floor(((ev.clientX - r.left) * sx - m.l) / band)));
    xh.setAttribute('x1', xc(i)); xh.setAttribute('x2', xc(i)); xh.style.display = '';
    let dots = '', rows = '', stackTot = 0, anyStack = false;
    cfg.series.forEach(s => {
      const v = s.values[i]; if (v == null) return;
      const f = s.fmt || yf;
      if (s.stack) { stackTot += v; anyStack = true; }
      if (s.type === 'line' && !s.dash) dots += `<circle cx="${xc(i)}" cy="${y(v)}" r="4.5" fill="${s.color}" stroke="var(--bg)" stroke-width="2"/>`;
      rows += `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${f(v)}</b></div>`;
    });

    dg.innerHTML = dots;

}
function tableView(cfg) {

/* ---------- 6. views ---------- */
const dist = mi => mi * (S.unit === 'km' ? 1.609344 : 1);
const dU = () => S.unit;
const distFmt = mi => n1(dist(mi));
function wkDist(w) {
  if (w.mi == null) return '–';
  if (w.t === 'Swimming') return S.unit === 'km' ? n0(w.mi * 1609.344) + ' m' : n0(w.mi * 1760) + ' yd';
  return (w.est ? '~' : '') + distFmt(w.mi) + ' ' + dU();
}
function fmtDur(min) {
  const t = Math.round(min * 60), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function wkPace(w) {
  if (!['Running', 'Walking', 'Hiking'].includes(w.t) || !w.mi || w.mi < .1) return '–';
  const perMi = w.min / w.mi; if (perMi < 3.5 || perMi > 35) return '–';        // not a believable pace
  const per = w.min / dist(w.mi), m = Math.floor(per), s = Math.round((per - m) * 60);
  return s === 60 ? `${m + 1}:00` : `${m}:${String(s).padStart(2, '0')}`;
}
const prettyType = t => t.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^High Intensity Interval Training$/, 'HIIT');

function range() {
  const last = M.last;
  const first = S.range === 'all' ? M.first : (addDays(last, -(+S.range - 1)) < M.first ? M.first : addDays(last, -(+S.range - 1)));
  return [first, last];
}
function avgField(f, a, b, skipZero) {
  let t = 0, c = 0;
  for (let n = dnum(a), e = dnum(b); n <= e; n++) { const v = M.daily[dstr(n)]?.[f]; if (v != null && !(skipZero && v === 0)) { t += v; c++; } }
  return c ? {v: t / c, c} : null;
}
function delta(cur, prev, fmt, unitWord) {
  if (!cur || !prev || !prev.v) return '';
  const diff = cur.v - prev.v, pct = diff / prev.v * 100;
  if (Math.abs(pct) < .5) return 'about the same as the period before';
  return `${diff > 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))}${unitWord || ''} vs the period before`;
}

function statsHTML(a, b) {
  const len = dnum(b) - dnum(a) + 1;
  const pa = addDays(a, -len), pb = addDays(a, -1), hasPrev = S.range !== 'all' && pa >= M.first;
  const st = (f, z) => [avgField(f, a, b, z), hasPrev ? avgField(f, pa, pb, z) : null];
  const [steps, steps0] = st('steps', true), [move, move0] = st('move', true), [ex, ex0] = st('ex', true), [rhr, rhr0] = st('rhr');
  const ws = M.workouts.filter(w => w.d >= a && w.d <= b);
  const ws0 = hasPrev ? M.workouts.filter(w => w.d >= pa && w.d <= pb) : [];
  let closed = 0, tot = 0;
  for (let n = dnum(a), e = dnum(b); n <= e; n++) { const x = M.daily[dstr(n)]; if (x && x.moveGoal > 0) { tot++; if (x.move >= x.moveGoal) closed++; } }
  const sleep = avgField('sleep', a, b);
  const cell = (label, val, unit, d) => `<div class="stat"><div class="l">${label}</div><div class="v">${val}${unit ? `<small>${unit}</small>` : ''}</div><div class="d">${d || '&nbsp;'}</div></div>`;
  let wMi = 0; for (let n = dnum(a), e = dnum(b); n <= e; n++) wMi += M.daily[dstr(n)]?.dist || 0;   // all tracked, not just logged workouts
  return `<div class="stats">
    ${cell('Steps per day', steps ? n0(steps.v) : '–', '', delta(steps, steps0, n0))}
    ${cell('Move ring per day', move ? n0(move.v) : '–', 'Cal', delta(move, move0, n0))}
    ${cell('Exercise per day', ex ? n0(ex.v) : '–', 'min', delta(ex, ex0, n0))}
    ${cell('Move ring closed', tot ? Math.round(closed / tot * 100) : '–', tot ? '% of days' : '', tot ? `${n0(closed)} of ${n0(tot)} days` : '')}
    ${cell('Workouts', n0(ws.length), '', hasPrev ? (ws.length === ws0.length ? 'same as the period before' : `${Math.abs(ws.length - ws0.length)} ${ws.length > ws0.length ? 'more' : 'fewer'} than the period before`) : '')}
    ${cell('Walking + running', n0(dist(wMi)), dU(), 'everything your watch tracked')}
    ${cell('Resting heart rate', rhr ? n0(rhr.v) : '–', rhr ? 'bpm' : '', rhr && rhr0 ? delta(rhr, rhr0, x => n1(x), ' bpm') : '')}
    ${sleep && sleep.c >= 3 ? cell('Sleep per night', n1(sleep.v / 60), 'h', `${sleep.c} nights logged`) : ''}
  </div>`;
}

/* rings */
function ringsSVG(x) {

  let s = '';

    if (p > 0) s += `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(p * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 100 100)"/>`;
  }
  return `<svg viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Activity rings">${s}</svg>`;
}
function dayHTML() {

    x.rhr != null ? `<span><b>${n0(x.rhr)}</b> bpm resting</span>` : '', x.hrv != null ? `<span><b>${n0(x.hrv)}</b> ms HRV</span>` : '',

    </div></div>`;
}

/* calendar heatmap of the Move ring */
function heatmapHTML(W) {
  const years = []; for (let y = +M.last.slice(0, 4); y >= +M.first.slice(0, 4); y--) years.push(y);
  let a, b;
  if (S.year === 'last') { b = M.last; a = addDays(b, -364); }
  else { a = S.year + '-01-01'; b = +S.year === +M.last.slice(0, 4) ? M.last : S.year + '-12-31'; }
  if (a < M.first) a = M.first;
  const n0d = weekStart(dnum(a)), nEnd = dnum(b), weeks = Math.floor((nEnd - n0d) / 7) + 1;
  const gap = 2, left = 26, top = 16;
  const cs = Math.max(8, Math.min(16, Math.floor((W - left) / weeks) - gap));
  const w = left + weeks * (cs + gap), h = top + 7 * (cs + gap);
  let cells = '', months = '', lastM = '';
  for (let n = n0d; n <= nEnd; n++) {
    const d = dstr(n); if (d < a) continue;
    const col = Math.floor((n - n0d) / 7), row = (n + 3) % 7;
    const x = M.daily[d], p = x && x.moveGoal > 0 ? x.move / x.moveGoal : null;
    const fill = p == null ? 'var(--cell)' : p >= 1 ? 'var(--c-move)' : `color-mix(in srgb, var(--c-move) ${Math.round(18 + 50 * p)}%, var(--cell))`;
    const sel = d === S.day ? ' stroke="var(--ink)" stroke-width="2"' : '';
    cells += `<rect class="c" data-day="${d}" x="${left + col * (cs + gap)}" y="${top + row * (cs + gap)}" width="${cs}" height="${cs}" rx="2.5" fill="${fill}"${sel}/>`;
    if (row === 0 || n === n0d) { const mo = d.slice(0, 7); if (mo !== lastM && d.slice(8) <= '07') { months += `<text x="${left + col * (cs + gap)}" y="10">${fmtDate(d, {month: 'short'})}</text>`; lastM = mo; } }

async function fetchJson(url) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 12000);
  try {
    const r = await fetch(url, {signal: ac.signal});
    if (r.status === 429) throw new Error('limit reached');
    if (!r.ok) throw new Error('status ' + r.status);
    return await r.json();
  } catch (e) { throw new Error(e.name === 'AbortError' ? 'timed out' : e.message); }
  finally { clearTimeout(t); }
}

    serving: p.serving_quantity > 0 ? {label: `serving (${p.serving_size || rnd(p.serving_quantity) + ' g'})`, g: +p.serving_quantity} : null};

async function foodSearch(q) {

  const key = fdcKey() || 'DEMO_KEY', e = encodeURIComponent, ck = q.toLowerCase() + '|' + (key === 'DEMO_KEY' ? 0 : 1);
  if (memo.has(ck)) { fs.results = memo.get(ck); fs.busy = false; fs.err = ''; return foodPaintRes(); }
  const [u, o] = await Promise.allSettled([
    fetchJson(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${e(q)}&pageSize=8&dataType=${e('Foundation,SR Legacy,Survey (FNDDS)')}&api_key=${e(key)}`),

async function loadPortions(item) {

    memo.set(pk0, j);
    const seen = new Set(), ps = []; let cupUsda = 0;
    for (const p of j.foodPortions || []) {
      if (!(p.gramWeight > 0)) continue;
      const amt = p.amount > 0 ? p.amount : 1;
      const desc = String(p.modifier || p.portionDescription || (p.measureUnit && p.measureUnit.name !== 'undetermined' ? p.measureUnit.name : '') || 'portion').trim();
      const label = `${desc} (${rnd(p.gramWeight)} g)`;
      if (/^cups?$/i.test(desc) && !cupUsda) { cupUsda = p.gramWeight / amt; continue; }      // a plain cup portion feeds the cup/tbsp/tsp units instead
      if (!seen.has(label)) { seen.add(label); ps.push({label, g: p.gramWeight / amt}); }

    const pk = S.food.pick;

    else if (!pk.touched) { pk.ui = pk.units.findIndex(u => u.hh === 1); pk.qty = 1; }
    else pk.ui += 0;

}

/* ---------- 6c. weight + "my math" calorie estimate ----------
   Weigh-ins typed here live in the same OneDrive log file as food (F.weights). Estimates are labelled models:
   resting = Mifflin-St Jeor; walking/running = standard net energy per km from the day's distance (running rate for
   logged runs); other workouts = MET x time; heart-rate = Keytel et al. over the minutes at 100+ bpm. Nothing here
   is a measurement, and Apple's numbers are models too. */
const LB = 0.45359237, KM = 1.609344;
const MET = {Cycling: 7.5, Swimming: 7, HighIntensityIntervalTraining: 8, TraditionalStrengthTraining: 5, FunctionalStrengthTraining: 5, CoreTraining: 4, Elliptical: 5, Rowing: 7, Yoga: 3, Pilates: 3.5, StairClimbing: 8, MixedCardio: 7, Dance: 5, Tennis: 7, Basketball: 6.5, Soccer: 7, Golf: 3.5, Cooldown: 2.5, Flexibility: 2.5, Other: 4};
const WALKRUN = new Set(['Running', 'Walking', 'Hiking']);
function allWeights() {                                   // [[date, lb]] sorted; weigh-ins typed here replace Health's for the same day
  const m = new Map(); for (const [d, v] of (M ? M.weights : [])) m.set(d, {lb: v, src: 'Health'});
  for (const w of F.weights) m.set(w.d, {lb: w.lb, src: 'entered here', id: w.id});
  return [...m].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([d, o]) => [d, o.lb, o.src, o.id]);
}
function weightOn(ws, d) {                                // nearest weigh-in on or before the day, else the first one
  let r = null; for (const w of ws) { if (w[0] <= d) r = w; else break; }
  return r || ws[0] || null;
}
const ageOn = (dob, d) => (dnum(d) - dnum(dob)) / 365.2425;
function estimateDay(d, wLb, P) {
  const x = M.daily[d]; if (!x || x.basal == null || x.move == null) return null;
  const W = wLb * LB, A = ageOn(P.dob, d), male = P.sex !== 'female';
  const rest = 10 * W + 6.25 * P.heightCm - 5 * A + (male ? 5 : -161);
  const ws = M.workouts.filter(w => w.d === d);
  let runMi = 0, other = 0;
  for (const w of ws) { if (w.t === 'Running') runMi += w.mi || 0; else if (!WALKRUN.has(w.t)) other += ((MET[w.t] || 4) - 1) * W * (w.min / 60); }
  const tot = x.dist || 0; runMi = Math.min(runMi, tot);
  const form = W * (0.53 * (tot - runMi) * KM + 1.0 * runMi * KM) + other;
  let hr = null;
  if (x.hrMinX > 0) {
    const T = x.hrMinX, avg = x.hrSumX / T;
    const kpm = (male ? (-55.0969 + 0.6309 * avg + 0.1988 * W + 0.2017 * A) : (-20.4022 + 0.4472 * avg - 0.1263 * W + 0.074 * A)) / 4.184;
    hr = Math.max(0, kpm * T - rest / 1440 * T);
  } else hr = 0;
  return {restA: x.basal, actA: x.move, restM: rest, actF: form, actH: hr};
}

function calPaint() {
  const h = $('#calhost'); if (!h || !M) return;
  const P = M.profile, ws = allWeights();
  if (!P || !P.dob || !P.heightCm) { h.innerHTML = '<p class="note" style="padding:6px 0">This needs your age, sex and height, which come from the Health export. Import a fresh export (Send export to OneDrive, or Open file) and they appear here.</p>'; return; }
  if (!ws.length) { h.innerHTML = '<p class="note" style="padding:6px 0">Add a weigh-in above and the math appears.</p>'; return; }
  const [a, b] = range(), days = listDays(a, b).filter(d => d < today()), gran = granFor(days.length);
  const est = {}; let nOk = 0;
  for (const d of days) { const w = weightOn(ws, d), e = w && estimateDay(d, w[1], P); if (e) { est[d] = e; nOk++; } }
  if (!nOk) { h.innerHTML = '<p class="note" style="padding:6px 0">No days with Apple Watch energy data in this range.</p>'; return; }
  const avg = f => { let t = 0, c = 0; for (const d in est) { t += f(est[d]); c++; } return t / c; };
  const aT = avg(e => e.restA + e.actA), fT = avg(e => e.restM + e.actF), hT = avg(e => e.restM + e.actH);
  const aR = avg(e => e.restA), mR = avg(e => e.restM), aA = avg(e => e.actA), fA = avg(e => e.actF), hA = avg(e => e.actH);
  const pc = (v, base) => { const p = (v - base) / base * 100; return (p > 0 ? '+' : p < 0 ? '−' : '') + Math.abs(Math.round(p)) + '% vs Apple'; };
  const last = ws[ws.length - 1], stale = dnum(b) - dnum(last[0]) > 60;
  const cell = (l, v, s) => `<div class="stat"><div class="l">${l}</div><div class="v">${n0(v)}<small>Cal/day</small></div><div class="d">${s || '&nbsp;'}</div></div>`;
  const wnote = stale ? `<p class="meta">Your latest weigh-in is ${n1(last[1])} lb from ${fmtDate(last[0])}. The math uses it for every day since, so add a current one for a better estimate.</p>` : '';
  h.innerHTML = `<p class="lede">${n0(nOk)} days with Apple Watch data in this range (today excluded). Profile from your export: ${P.sex || 'unknown sex'}, ${Math.floor(ageOn(P.dob, b))}, ${Math.floor(Math.round(P.heightCm / 2.54) / 12)} ft ${Math.round(P.heightCm / 2.54) % 12} in.</p>
    <div class="stats">${cell('Apple, total', aT, 'resting ' + n0(aR) + ' + active ' + n0(aA))}${cell('My formula, total', fT, pc(fT, aT) + ' · resting ' + n0(mR) + ' + active ' + n0(fA))}${cell('My heart-rate, total', hT, pc(hT, aT) + ' · resting ' + n0(mR) + ' + active ' + n0(hA))}</div>${wnote}
    <div id="calcharts" style="margin-top:22px"></div>
    <details class="how2"><summary>How my math works</summary><p class="meta">Resting uses the Mifflin-St Jeor formula with your weight, height and age. Formula active adds walking and running from each day’s distance (about 0.53 Cal per kg per km walking, 1.0 running, using your logged runs for the running part) plus other workouts as MET × time. Heart-rate active uses the Keytel formula over the minutes your heart rate was 100 or higher, minus resting for those minutes, so it only sees exercise-level effort and misses light all-day movement. These are estimates, and so are Apple’s. The real check is your weight trend against what you eat.</p></details>`;
  const day = f => bucketed(days, gran, d => est[d] ? f(est[d]) : null);
  const ap = day(e => e.restA + e.actA), fo = day(e => e.restM + e.actF), hr = day(e => e.restM + e.actH);
  const sa = day(e => e.actA), sf = day(e => e.actF), sh = day(e => e.actH);
  const L = (name, color, vals, extra) => Object.assign({name, color, type: 'line', values: vals, fmt: x => n0(x) + ' Cal'}, extra);
  const s1 = [L('Apple', 'var(--ink)', ap.vals, {thin: true}), L('My formula', 'var(--c-steps)', fo.vals), L('My heart-rate', 'var(--c-hr)', hr.vals)];
  const s2 = [L('Apple active', 'var(--ink)', sa.vals, {thin: true}), L('My formula active', 'var(--c-steps)', sf.vals), L('My heart-rate active', 'var(--c-hr)', sh.vals)];
  for (let i = charts.length - 1; i >= 0; i--) if (charts[i].id === 'c-cal' || charts[i].id === 'c-act') charts.splice(i, 1);
  const sub = gran === 'day' ? 'Daily' : 'Average per day';
  $('#calcharts').innerHTML = `<div class="grid2">${block('c-cal', 'Total burned', sub, s1)}${block('c-act', 'Active only', sub, s2)}</div>`;
  mount('c-cal', {title: 'Total burned', gran, labels: ap.labels, series: s1, zero: false, yFmt: n0});

}

function page() {
  const [a, b] = range(), days = listDays(a, b), gran = granFor(days.length);

  add('c-ex', {title: 'Exercise', labels: ex.labels, series: [ser('Minutes', 'var(--c-ex)', 'bar', ex.vals), ser('Goal', 'var(--ink3)', 'line', eg.vals, {dash: true, thin: true})]});

  // heart
  const rh = B(fld('rhr')), hv = B(fld('hrv')), wh = B(fld('whr'));
  const vo = bucketed(days, gran, fld('vo2'));
  add('c-rhr', {title: 'Resting heart rate', zero: false, labels: rh.labels, series: [ser('Resting', 'var(--c-hr)', 'line', rh.vals, {fmt: x => n0(x) + ' bpm'})], yFmt: n0});
  add('c-hrv', {title: 'Heart rate variability', zero: false, labels: hv.labels, series: [ser('HRV (SDNN)', 'var(--c-hrv)', 'line', hv.vals, {fmt: x => n0(x) + ' ms'})]});
  const hasVo2 = vo.vals.filter(v => v != null).length >= 2;

  // workouts per bucket, stacked by type
  const order = typeOrder(), top = order.slice(0, 3), colors = ['var(--s1)', 'var(--s2)', 'var(--s3)'];

  // body & food
  const sl = B(d => { const v = M.daily[d]?.sleep; return v == null ? null : v / 60; });
  const hasS = sl.vals.filter(v => v != null).length >= 3;
  if (hasS) add('c-sleep', {title: 'Sleep', labels: sl.labels, series: [ser('Hours asleep', 'var(--c-sleep)', 'bar', sl.vals, {fmt: x => n1(x) + ' h'})], yFmt: x => n1(x).replace(/\.0$/, '')});

  const blk = (id, sub) => { const c = pend.find(p => p[0] === id)[1]; return block(id, c.title, sub === undefined ? gw : sub, c.series); };
  const bodyBits = [hasS ? blk('c-sleep') : ''].filter(Boolean);

  const html = `
  <section class="first" aria-labelledby="h-over"><h2 id="h-over">${fmtDate(a)} – ${fmtDate(b)}</h2>
    <p class="lede">${n0(days.length)} days${S.range === 'all' ? '' : ', compared with the same number of days before'}. Numbers are daily averages unless noted.</p>
    ${statsHTML(a, b)}</section>

  <section aria-labelledby="h-day"><h2 id="h-day">Activity rings</h2>
    <p class="lede">Pick a day, or click any square in the calendar below.</p>
    <div id="dayhost">${dayHTML()}</div>
    <div style="height:28px"></div>
    <div id="hmhost"></div></section>

  <section aria-labelledby="h-act"><h2 id="h-act">Activity</h2>
    <p class="lede">Steps and distance use whichever device logged the most each day (Apple Watch or iPhone), so nothing is counted twice.</p>
    <div class="grid2">${blk('c-steps')}${blk('c-dist')}${blk('c-move')}${blk('c-ex')}</div></section>

  <section aria-labelledby="h-heart"><h2 id="h-heart">Heart</h2>
    <p class="lede">Resting heart rate and HRV come from Apple Watch readings.</p>
    <div class="grid2">${blk('c-rhr')}${blk('c-hrv')}${hasVo2 ? blk('c-vo2', 'Apple Watch estimates') : ''}</div></section>

  <section aria-labelledby="h-wk"><h2 id="h-wk">Workouts</h2>
    <p class="lede">${n0(inR.length)} in this range. Click a column heading to sort.</p>
    ${wser.length ? `<div style="margin-bottom:26px">${blk('c-wk', 'Minutes per ' + (gran === 'day' ? 'day' : gran))}</div>` : ''}
    <div id="wkhost">${wkViewHTML(a, b)}</div></section>

  <section aria-labelledby="h-wt"><h2 id="h-wt">Weight</h2>
    <p class="lede">Add weigh-ins here; Health’s own are included. The calorie math below uses the weigh-in nearest each day.</p>
    <div id="wthost"></div></section>

  <section aria-labelledby="h-cal"><h2 id="h-cal">Calories burned: Apple vs my math</h2>
    <div id="calhost"></div></section>

  <section aria-labelledby="h-food"><h2 id="h-food">Food</h2>
    <p class="lede">Log what you eat and compare it with what your watch says you burned. Calories burned = resting + active. Your food log is stored separately from the Health import.</p>
    <div id="foodhost"></div></section>

  ${bodyBits.length ? `<section aria-labelledby="h-body"><h2 id="h-body">Sleep</h2>
    <p class="lede">Only what your apps wrote to Apple Health — these are usually sparse.</p><div class="grid2">${bodyBits.join('')}</div></section>` : ''}

  <footer>
    <p>Imported from ${esc(M.source || 'export')}${M.exportDate ? ', exported ' + fmtDate(M.exportDate) : ''}. ${n0(M.records || 0)} health records were read on the device that imported the export. ${CLOUD ? 'Only the summary and your food log are stored, in your OneDrive; this browser keeps nothing.' : 'Your Health data was not uploaded.'}</p>
    <p>Move, Exercise and Stand come from Apple’s daily activity summary. Active Cal is Apple’s “Cal”, which equals kilocalories.</p>
  </footer>`;
  return {html, pend};
}

function barHTML() {
  const rb = (v, l) => `<button data-act="range" data-v="${v}" aria-pressed="${S.range === v}">${l}</button>`;
  const hasM = !!M;
  $('#barin').innerHTML = `<span class="brand">Health log</span><span class="ver" title="Page version">page ${PAGE_VERSION}</span>
    ${hasM && S.view !== 'fav' && S.view !== 'home' ? `<span class="seg" role="group" aria-label="Date range">${rb('30', '30 days')}${rb('90', '90 days')}${rb('365', '1 year')}${rb('1095', '3 years')}${rb('all', 'All')}</span>
    <span class="seg" role="group" aria-label="Distance unit"><button data-act="unit" data-v="mi" aria-pressed="${S.unit === 'mi'}">mi</button><button data-act="unit" data-v="km" aria-pressed="${S.unit === 'km'}">km</button></span>` : ''}
    <button class="btn" data-act="theme" aria-label="Switch light and dark">Theme</button>
    ${CLOUD && account ? `<button class="btn" data-act="refresh">Refresh</button>` : ''}
    ${CLOUD && account ? `<button class="btn" data-act="sendzip">Send export to OneDrive</button>` : ''}
    ${hasM && CLOUD && account ? `<button class="btn" data-act="cloudsave">Save to OneDrive</button>` : ''}
    ${hasM ? `<button class="btn" data-act="save">Download summary</button>` : ''}
    ${CLOUD && !account ? (S.cloud.status === 'loading' ? '' : `<button class="btn solid" data-act="signin">Sign in with Microsoft</button>`) : `<button class="btn solid" data-act="open">${hasM ? 'Open another file' : 'Open file'}</button>`}
    ${CLOUD && account ? `<span class="who" title="${esc(account.username || '')}">${esc(account.name || account.username || '')}</span><button class="btn" data-act="signout">Sign out</button>` : ''}`;
}

function render() {
  barHTML();
  const app = $('#app'); charts.length = 0; hideTip();
  if (S.view === 'fav') return favScreen();
  if (S.busy) {
    const b = S.busy, pct = b.total ? Math.min(100, b.read / b.total * 100) : 0;
    app.innerHTML = `<div class="hero"><h1>Reading your export</h1><p>${esc(b.name)} — this takes up to a minute for a large export. Keep this tab open.</p>
      <div class="meter"><i style="width:${pct}%"></i></div><p class="meta" id="prog">${prog(b)}</p></div>`;
    return;
  }
  if (!M) { app.innerHTML = (S.cloud.status === 'ready' || S.cloud.status === 'nofile' ? noteHTML() : '') + emptyHTML(); return; }
  if (S.view === 'home') { app.innerHTML = noteHTML() + `<section class="first"><div id="homehost">${homeHTML()}</div></section>`; return viewStart(); }
  const {html, pend} = page();
  app.innerHTML = noteHTML() + (S.view === 'all' ? html : detailHTML(html));
  for (const [id, cfg] of pend) mount(id, cfg);
  mountHeatmap();
  viewStart();
}
function detailHTML(html) {                               // one screen = a few of page()'s sections plus a back link
  const r = ROUTES[S.view], [a, b] = range(), t = document.createElement('template'); t.innerHTML = html;
  const kids = [...t.content.children], keep = r.s.map(id => kids.find(el => el.getAttribute('aria-labelledby') === id)).filter(Boolean).concat(kids.filter(el => el.tagName === 'FOOTER')).map(el => el.outerHTML).join('');
  return `<section class="first"><p style="margin:0 0 6px"><a href="#">← Back to Health log</a></p><h2>${esc(r.t)}</h2><p class="lede">${fmtDate(a)} – ${fmtDate(b)}. Use the range buttons above for more history.</p></section>` + (keep.includes('<section') ? keep : `<section><p class="note">Nothing to show here yet.</p></section>` + keep);
}
function viewStart() {                                    // food log feeds the Food/Weight/Calories screens and the home tiles
  if ($('#foodhost')) return foodStart();
  const go = () => { if (S.view === 'home') { const h = $('#homehost'); if (h) h.innerHTML = homeHTML(); } else calPaintAll(); };
  if (foodReady) return go();
  foodLoad().then(() => { foodReady = true; go(); }).catch(() => { F = emptyF(); S.food.save = 'Sign in again to load your food log.'; foodReady = true; go(); });
}
const dayLabel = d => d === today() ? 'Today' : d === addDays(today(), -1) ? 'Yesterday' : fmtDate(d, {weekday: 'short', month: 'short', day: 'numeric'});
function spark(vals, color) {                             // tiny trend line; null days leave gaps
  const pts = vals.map((v, i) => v == null ? null : [i, v]).filter(Boolean);
  if (pts.length < 2) return '<svg viewBox="0 0 100 30" aria-hidden="true"></svg>';
  const lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1])), n = Math.max(1, vals.length - 1);
  const xy = p => (p[0] / n * 100).toFixed(1) + ',' + (27 - (hi === lo ? .5 : (p[1] - lo) / (hi - lo)) * 24).toFixed(1);
  return `<svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" points="${pts.map(xy).join(' ')}"/></svg>`;
}
function homeHTML() {
  const L = M.lastAct || M.last, ds = listDays(addDays(L, -13), L), dd = d => M.daily[d] || {}, tile = (href, label, big, unit, sub, sp, color) =>
    `<a class="tile" href="#${href}"><div class="tl"><span>${label}</span><span aria-hidden="true">›</span></div><div class="tv">${big}${unit ? `<small>${unit}</small>` : ''}</div><div class="ts">${sub || '&nbsp;'}</div>${sp ? spark(sp, color) : ''}</a>`;
  const out = [], td = today(), io = inOut(td);
  let bd = null; for (let i = 0; i < 8 && !bd; i++) { const d = addDays(td, -i); if (M.daily[d] && inOut(d).out != null) bd = d; }
  const tds = listDays(addDays(td, -13), td);
  out.push(tile('food', 'Calories · today', n0(io.inn || 0), 'Cal in', bd ? `Burned ${n0(inOut(bd).out)} on ${dayLabel(bd)}` : 'Tap to log food', tds.map(d => inOut(d).inn), 'var(--c-food)'));
  const ws = allWeights(), w = ws[ws.length - 1];
  if (w) { const p = weightOn(ws, addDays(w[0], -30)), ch = p && p[0] < w[0] ? w[1] - p[1] : null;
    out.push(tile('weight', 'Weight', n1(w[1]), 'lb', `${dayLabel(w[0])}${ch != null ? ` · ${ch > 0 ? '+' : ch < 0 ? '−' : ''}${n1(Math.abs(ch))} lb vs 30 days before` : ''}`, ws.slice(-12).map(x => x[1]), 'var(--c-weight)')); }
  else out.push(tile('weight', 'Weight', '—', '', 'Tap to add a weigh-in'));
  const x = dd(L);
  out.push(tile('activity', `Activity · ${dayLabel(L)}`, x.steps != null ? n0(x.steps) : '—', x.steps != null ? 'steps' : '', [x.move != null ? `Move ${n0(x.move)}${x.moveGoal ? '/' + n0(x.moveGoal) : ''} Cal` : '', x.ex != null ? `Exercise ${n0(x.ex)} min` : ''].filter(Boolean).join(' · '), ds.map(d => dd(d).steps), 'var(--c-steps)'));
  const wk = M.workouts.slice().sort((p, q) => p.d < q.d ? 1 : -1), lw = wk[0], wcount = M.workouts.filter(o => o.d >= addDays(M.last, -6)).length;
  out.push(tile('workouts', 'Workouts', lw ? esc(prettyType(lw.t)) : '—', lw ? n0(lw.min) + ' min' : '', lw ? `${dayLabel(lw.d)} · ${wcount} in the last 7 days` : 'None logged', ds.map(d => { const m = M.workouts.filter(o => o.d === d).reduce((t, o) => t + o.min, 0); return m || null; }), 'var(--c-ex)'));
  let hd = null; for (let i = ds.length - 1; i >= 0 && !hd; i--) if (dd(ds[i]).rhr != null) hd = ds[i];
  if (hd) out.push(tile('heart', `Heart · ${dayLabel(hd)}`, n0(dd(hd).rhr), 'bpm resting', dd(hd).hrv != null ? `HRV ${n0(dd(hd).hrv)} ms` : '', ds.map(d => dd(d).rhr), 'var(--c-hr)'));
  let sd = null; for (let i = ds.length - 1; i >= 0 && !sd; i--) if (dd(ds[i]).sleep != null) sd = ds[i];
  if (sd) out.push(tile('sleep', `Sleep · ${dayLabel(sd)}`, n1(dd(sd).sleep / 60), 'h', '', ds.map(d => dd(d).sleep != null ? dd(d).sleep / 60 : null), 'var(--c-sleep)'));
  return `<h2>Health log</h2><p class="lede">Latest health data is from ${fmtDate(M.last)}${M.exportDate ? ' (export ' + fmtDate(M.exportDate) + ')' : ''}; food and weight are live. Tap a tile for details and history.</p><div class="tiles">${out.join('')}</div>
    <p class="meta" style="margin-top:18px"><a class="lnk" href="#favorites">Manage favorites</a> · <a class="lnk" href="#all">Everything on one page</a></p>`;
}
const prog = b => `${(b.read / 1048576).toFixed(0)} MB of ${(b.total / 1048576).toFixed(0)} MB · ${n0(b.records)} records`;
function mountHeatmap() {
  const h = $('#hmhost'); if (!h) return;
  h.innerHTML = `<div class="chead"><h3>Move ring, day by day</h3><span class="sub">Darker means closer to your goal</span></div>` + heatmapHTML(Math.max(320, h.clientWidth));
}

/* ---------- 7. events ---------- */
async function openFile(file) {
  if (!file) return;
  S.error = null; S.busy = {name: file.name, read: 0, total: file.size, records: 0}; render();
  let imported = false;
  try {
    const m = await loadAny(file, (read, total, records) => {
      Object.assign(S.busy, {read, total, records});
      const p = $('#prog'); if (p) { p.textContent = prog(S.busy); $('.meter i').style.width = Math.min(100, total ? read / total * 100 : 0) + '%'; }
    });
    if (!m.first) throw new Error('No health data was found in that file.');
    M = S.model = m; S.day = m.lastAct || m.last; S.shown = 25; S.type = 'all';
    if (!CLOUD && !Store.save(m)) console.info('Summary is too large to keep in this browser; use Download summary instead.');
    S.cloud.note = CLOUD && !account ? 'Shown in this tab only. Sign in with Microsoft to keep it in OneDrive.' : '';
    imported = true;
  } catch (e) {
    console.error(e); S.error = e.message || String(e);
  }
  S.busy = null; render();
  if (imported && CLOUD && account) await cloudSaveFlow();
}
function saveSummary() {
  const blob = new Blob([JSON.stringify(M)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `health-summary-${M.last}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function setDay(d) {
  if (d < M.first) d = M.first; if (d > M.last) d = M.last;
  S.day = d; $('#dayhost').innerHTML = dayHTML(); mountHeatmap();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-day]'); if (!t) return;
  if (t.dataset.day && !t.dataset.act) return setDay(t.dataset.day);
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'open': $('#file').value = ''; $('#file').click(); break;
    case 'save': saveSummary(); break;
    case 'signin': signIn(); break;
    case 'signout': signOut(); break;
    case 'refresh': pullAndShow(); break;
    case 'cloudsave': cloudSaveFlow(); break;
    case 'sendzip': if (S.cloud.busyUp) break; $('#zipfile').value = ''; $('#zipfile').click(); break;
    case 'theme': { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light'); const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; Store.pref('theme', nx); render(); break; }
    case 'range': S.range = v; S.shown = 25; render(); break;
    case 'unit': S.unit = v; Store.pref('unit', v); render(); break;
    case 'tbl': { const id = t.dataset.id; S.tbl[id] = !S.tbl[id]; const c = charts.find(x => x.id === id); t.textContent = S.tbl[id] ? 'Chart' : 'Table'; if (c) drawChart(id, c.cfg); break; }
    case 'day': setDay(t.dataset.n === 'latest' ? (M.lastAct || M.last) : addDays(S.day, +t.dataset.n)); break;
    case 'wview': S.wview = v; S.shown = 25; { const [a, b] = range(); $('#wkhost').innerHTML = wkViewHTML(a, b); } break;
    case 'type': S.type = t.dataset.t; S.shown = 25; { const [a, b] = range(); $('#wkhost').innerHTML = wkViewHTML(a, b); } break;
    case 'sort': { const k = t.dataset.k; S.sort = S.sort.k === k ? {k, dir: -S.sort.dir} : {k, dir: k === 's' || k === 't' ? (k === 't' ? 1 : -1) : -1}; { const [a, b] = range(); $('#wkhost').innerHTML = wkViewHTML(a, b); } break; }
    case 'more': S.shown += 50; { const [a, b] = range(); $('#wkhost').innerHTML = wkViewHTML(a, b); } break;
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'zipfile') { sendExport(ev.target.files[0]); return; }
  if (ev.target.id === 'file') return openFile(ev.target.files[0]);
  if (ev.target.id === 'daypick' && ev.target.value) setDay(ev.target.value);
  if (ev.target.id === 'hmyear') { S.year = ev.target.value; mountHeatmap(); }
});
document.addEventListener('pointerover', ev => {
  const c = ev.target.closest && ev.target.closest('rect.c'); if (!c) return;
  const d = c.dataset.day, x = M.daily[d] || {};
  showTip(`<b>${esc(fmtDate(d, {weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'}))}</b>` + (x.moveGoal > 0 ? `<div class="r"><span>Move</span><b>${n0(x.move)} / ${n0(x.moveGoal)} Cal</b></div><div class="r"><span>Exercise</span><b>${n0(x.ex)} / ${n0(x.exGoal)} min</b></div><div class="r"><span>Stand</span><b>${n0(x.stand)} / ${n0(x.standGoal)} hr</b></div>` : '<div>No ring data</div>'), ev.clientX, ev.clientY);
});
document.addEventListener('pointermove', ev => { const c = ev.target.closest && ev.target.closest('rect.c'); if (c && tip.style.display === 'block') { const w = tip.offsetWidth, h = tip.offsetHeight; let l = ev.clientX + 14; if (l + w > innerWidth - 8) l = ev.clientX - w - 14; tip.style.left = l + 'px'; tip.style.top = Math.max(8, ev.clientY - h - 10) + 'px'; } });
document.addEventListener('pointerout', ev => { if (ev.target.closest && ev.target.closest('rect.c')) hideTip(); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); openFile(e.dataTransfer.files[0]); });
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (!M || S.busy) return; for (const c of charts) drawChart(c.id, c.cfg); mountHeatmap(); }, 120); }).observe($('#app'));

/* boot */
(async function boot() {
  const th = Store.pref('theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  if (!CLOUD) {
    const saved = Store.load();
    if (saved && saved.v === 1 && saved.first) { M = S.model = saved; S.day = saved.lastAct || saved.last; }
    return render();
  }
  render();                                                        // "Opening your health data"
  try { await initMsal(); } catch (e) { S.cloud.status = 'error'; S.cloud.msg = e.message; return render(); }
  if (!account) { S.cloud.status = 'signedout'; return render(); }
  await pullAndShow();
})();
window.HealthLog = {state: S, get model() { return M; }, open: openFile};
</script>
</body>
</html>
