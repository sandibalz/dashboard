<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f2f6">
<title>Collector Overview</title>
<style>

/* Layout: the existing Overview grid, unchanged, under an owner switcher. Single light look to match the real dashboard. */
:root {
  --bg: #f1f2f6; --panel: #ffffff; --ink: #2f3542; --mute: #57606f; --soft: #747d8c; --line: #e4e7eb; --line2: #eef0f3; --head: #f8f9fb;
  --accent: #3742fa; --good: #1e9e55; --warn: #ffa502; --bad: #d63031; --rowfail: #ffe8ea; --rowwarn: #fff8e1; --ok: #2ed573; --grey: #747d8c;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 0 8px; }
.banner { background: var(--rowwarn); border: 1px solid #ffe08a; color: #7a5b00; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin: 10px 0 0; line-height: 1.4; }
.owners { display: flex; gap: 8px; flex-wrap: wrap; }
.ob { flex: 1 1 120px; min-width: 0; text-align: left; border: 1px solid #ced4da; background: var(--panel); border-radius: 6px; padding: 7px 10px; cursor: pointer; font: inherit; color: var(--ink); }
.ob b { font-size: 14px; display: flex; align-items: center; gap: 6px; }
.ob small { display: block; font-size: 11px; color: var(--soft); margin-top: 1px; font-variant-numeric: tabular-nums; }
.ob.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.ob.on small { color: #dfe2ff; }
.ob:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cnt { font-size: 10px; font-weight: 700; color: #fff; background: var(--bad); border-radius: 8px; padding: 0 6px; line-height: 16px; }
.cnt.stale { background: var(--warn); }
.ob.on .cnt { background: #fff; color: var(--bad); }
.sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--mute); margin: 8px 0 2px; }
.sum span b { color: var(--ink); font-variant-numeric: tabular-nums; }
.stale-note { background: #ffe8ea; border: 1px solid #f5b5bb; color: #8a1f27; border-radius: 6px; font-size: 12px; padding: 6px 10px; margin-top: 8px; line-height: 1.4; }
h2 { font-size: 0.95em; color: var(--mute); margin: 18px 0 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.sbtn { color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; white-space: nowrap; }
.sbtn.run { background: var(--ok); } .sbtn.gr { background: var(--grey); }

/* ---- Overview grid: same rules as dashboard.html ---- */
.overview-grid { overflow-x: auto; border-radius: 6px; }
.overview-table { width: 100%; min-width: 1120px; table-layout: fixed; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); }
.overview-table th { text-align: left; font-size: 10px; color: var(--mute); text-transform: uppercase; letter-spacing: .4px; padding: 4px 6px; background: var(--head); border-bottom: 2px solid var(--line); white-space: nowrap; }
.overview-table th.num { text-align: right; }
.overview-table td { padding: 3px 6px; border-bottom: 1px solid var(--line2); font-size: 12px; vertical-align: middle; line-height: 1.25; overflow: hidden; }
.overview-table tbody tr:last-child td { border-bottom: none; }
.overview-table tbody tr:hover { background: var(--head); }
.overview-table .notecell { white-space: normal; line-height: 1.2; }
.overview-table .failnote { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #c0392b; font-weight: 600; font-size: 11px; margin-bottom: 1px; }
.overview-table tbody tr.row-stale { background-color: #ffdcdc; }
.overview-table tbody tr.row-stale:hover { background-color: #ffc7c7; }
.overview-table tbody tr.row-failed { background-color: var(--rowfail); }
.overview-table tbody tr.row-failed:hover { background-color: #ffd3d8; }
.overview-table tbody tr.row-no-recording { background-color: var(--rowwarn); }
.overview-table tbody tr.row-no-recording:hover { background-color: #ffedb3; }
.overview-table tr.row-disabled { opacity: .55; }
.overview-table input[type=text], .overview-table input[type=number], .overview-table select { font: inherit; font-size: 12px; width: 100%; padding: 2px 4px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: inherit; text-overflow: ellipsis; }
.overview-table input[type=text]:hover, .overview-table input[type=number]:hover, .overview-table select:hover { border-color: #ced4da; background: #fff; }
.overview-table input:focus, .overview-table select:focus { border-color: var(--accent); background: #fff; outline: none; }
.overview-table select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.overview-table input.nm { font-weight: 700; }
.sub { font-size: 11px; color: var(--soft); }
.c1 { display: flex; align-items: center; gap: 4px; }
.open { background: var(--accent); color: #fff; border: none; border-radius: 3px; padding: 2px 6px; font-size: 12px; cursor: pointer; flex: none; }
.mini { font-size: 11px; border: none; border-radius: 3px; color: #fff; cursor: pointer; }
.retry { background: var(--grey); } .okb { background: var(--ok); } .set { background: var(--accent); padding: 1px 7px; }
.ic { flex: none; width: 17px; height: 17px; padding: 0; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center; }
.ic:disabled { opacity: .6; cursor: not-allowed; }
.pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 8px; background: var(--line); color: var(--mute); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bal div:first-child { font-weight: 600; }
.bal div + div { font-size: 11px; color: var(--soft); }
.g { font-size: 11px; font-weight: 600; } .g.up { color: var(--good); } .g.dn { color: var(--bad); } .g.zero { color: #a4b0be; }
.st-success { color: var(--good); } .st-proc { color: var(--warn); } .st-fail { color: var(--bad); font-weight: 600; } .st-none { color: var(--warn); }
.setrow { display: none; gap: 3px; margin-top: 2px; }
tr:hover .setrow, .setrow:focus-within { display: flex; }
.setrow input { width: 64px !important; border-color: #ced4da !important; background: #fff !important; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.empty { color: #a4b0be; text-align: center; padding: 30px 10px; }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: #2f3542; color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 640px; margin: 0 auto; }
.toast code { display: block; margin-top: 6px; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #cfd6e4; white-space: pre-wrap; word-break: break-all; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(8px); opacity: 0; } } }

.setup { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 14px 0; max-width: 720px; }
.setup h3 { margin: 0 0 6px; font-size: 15px; }
.setup p, .setup li { font-size: 13px; line-height: 1.5; color: var(--mute); }
.setup label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 3px; }
.setup input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff; color: var(--ink); }
.btn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 9px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin: 12px 8px 0 0; }
.btn.alt { background: var(--grey); }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.tbtn { border: 1px solid #ced4da; background: #fff; border-radius: 6px; font-size: 12px; padding: 3px 10px; cursor: pointer; color: var(--ink); }
.err { background: #ffe8ea; border: 1px solid #f5b5bb; color: #8a1f27; border-radius: 6px; font-size: 12px; padding: 6px 10px; margin-top: 8px; line-height: 1.4; }
.ic.confirm { background: var(--bad); width: auto; padding: 0 5px; }
/* ---- phone cards ---- */
.viewbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 8px; }
.chip { border: 1px solid #ced4da; background: #fff; border-radius: 16px; font: inherit; font-size: 13px; padding: 5px 12px; color: var(--ink); cursor: pointer; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip i { font-style: normal; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
.viewbar .tbtn { margin-left: auto; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
.card.row-failed { background: var(--rowfail); } .card.row-stale { background: #ffdcdc; } .card.row-no-recording { background: var(--rowwarn); } .card.row-disabled { opacity: .6; }
.card .ch { display: flex; align-items: center; gap: 8px; }
.card .cn { flex: 1 1 auto; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cb { display: flex; gap: 5px; flex: none; }
.card .cb .ic { width: 30px; height: 30px; line-height: 30px; font-size: 13px; border-radius: 6px; }
.card .cb .ic.confirm { width: auto; padding: 0 8px; }
.card input[type=checkbox] { width: 20px; height: 20px; flex: none; }
.card .cs { font-size: 13px; margin-top: 5px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.card .cf { color: #c0392b; font-weight: 600; font-size: 12px; margin-top: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .cbal { display: flex; gap: 16px; font-size: 12px; margin-top: 5px; font-variant-numeric: tabular-nums; }
#pub { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
#pub h3 { margin: 0 0 6px; font-size: 15px; } #pub p, #pub li { font-size: 13px; line-height: 1.45; color: var(--mute); margin: 4px 0; }
#pub input[type=password], #pub input[type=text] { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; background: #fff; color: var(--ink); }
#pub .btn { margin: 10px 8px 0 0; padding: 8px 14px; font-size: 14px; } #pub .btn[disabled] { opacity: .5; }
#pub .st { font-weight: 700; } #pub .st.same { color: var(--good); } #pub .st.diff { color: var(--warn); } #pub .st.bad { color: var(--bad); }
code.k { background: var(--head); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="top">
  <div class="owners" id="owners" role="tablist" aria-label="Owner"></div>
  <div class="sum"><span id="sum" style="display:contents"></span><span class="tools"><span class="sub" id="refreshed"></span><button class="tbtn" id="btn-refresh" title="Reload from OneDrive">↻</button><button class="tbtn" id="btn-view">Table</button><button class="tbtn" id="btn-publish">Publish</button><button class="tbtn" id="btn-settings">Settings</button></span></div>
  <div id="notes"></div>
</div>
<div id="pub" hidden></div>
<div id="out"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
'use strict';
/* Collector Overview: reads each owner's chrome-state.json from OneDrive through Microsoft Graph.
   Nothing secret lives in this file: the client id is public by design and data needs your Microsoft sign-in. */
const OWNERS = ['Ben', 'Cindy', 'Jessica', 'Tyler'];
const SCOPES = ['Files.ReadWrite'];
const TZ = 'America/New_York';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const $ = id => document.getElementById(id);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const cfg = { clientId: LS.get('co.clientId', '1ee77fca-2582-4c3d-a13a-84f3ce009772'), root: LS.get('co.root', '/Documents/Collector-App') };
let pca = null, acct = null, cur = LS.get('co.owner', 'Ben'), started = false, loading = false, progress = '', lastRefresh = 0;
const state = {};     // owner -> { doc, at, err }
const statics = {};   // owner -> { file: { v, s } }  (schedule/login/notes read from the profile files, cached by file version)
const tried = new Set();
const pendingConfirm = {};
OWNERS.forEach(o => { const c = LS.get('co.state.' + o, null); if (c) state[o] = { doc: c.doc, at: c.at, err: null, cached: true }; statics[o] = LS.get('co.static.' + o, {}); });

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d) => Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
const gain = (g, d) => g > 0 ? '+' + fmt(g, d) : g < 0 ? fmt(g, d) : '±0';
const gcls = g => g > 0 ? 'up' : g < 0 ? 'dn' : 'zero';
const dt = (ms, o) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: TZ }, o)).format(new Date(ms));
const lastTxt = ms => ms ? dt(ms, { month: 'short', day: 'numeric' }) + ', ' + dt(ms, { hour: 'numeric', minute: '2-digit' }) : 'Never';
function span(ms) { const m = Math.round(Math.abs(ms) / 60000); const h = Math.floor(m / 60); return h >= 24 ? Math.floor(h / 24) + 'd ' + (h % 24) + 'h' : h ? h + 'h ' + (m % 60) + 'm' : m + 'm'; }
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const logSafe = n => String(n || '').toLowerCase().replace(/[^a-z0-9_.-]/g, '_');
function toast(msg, ms) { const t = $('toast'); t.innerHTML = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms || 7000); }
function describe(e) {
  if (!e) return 'Unknown error';
  if (e.status === 404) return 'Not found in OneDrive (' + (e.path || '') + '). Check the folder path in Settings.';
  if (e.status === 401 || e.status === 403) return 'Microsoft refused access (' + e.status + '). Sign in again from Settings.';
  if (e.status === 429) return 'Microsoft is rate-limiting requests. Try again in a minute.';
  return e.message || String(e);
}

/* ---------- Microsoft sign-in + Graph ---------- */
async function token() {
  if (!acct) throw new Error('Not signed in');
  try { return (await pca.acquireTokenSilent({ scopes: SCOPES, account: acct })).accessToken; }
  catch (e) { await pca.acquireTokenRedirect({ scopes: SCOPES }); throw new Error('Redirecting to Microsoft sign-in...'); }
}
async function g(path, opt) {
  opt = opt || {};
  for (let attempt = 0; attempt < 2; attempt++) {
    const t = await token();
    const r = await fetch(GRAPH + path, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + t }, opt.headers || {}) }));
    if (r.status === 429 && attempt === 0) { await new Promise(res => setTimeout(res, (+r.headers.get('Retry-After') || 2) * 1000)); continue; }
    if (!r.ok) { const e = new Error('Graph ' + r.status); e.status = r.status; e.path = path.replace(/^\/me\/drive\/root:/, '').replace(/[?:].*$/, ''); throw e; }
    return r;
  }
}
async function readText(path) {
  const m = await (await g('/me/drive/root:' + enc(path) + '?select=id,lastModifiedDateTime,@microsoft.graph.downloadUrl')).json();
  const u = m['@microsoft.graph.downloadUrl'];
  const r = u ? await fetch(u) : await g('/me/drive/root:' + enc(path) + ':/content');
  if (!r.ok) { const e = new Error('Download ' + r.status); e.status = r.status; e.path = path; throw e; }
  return { text: (await r.text()).replace(/^﻿/, ''), mtime: m.lastModifiedDateTime };
}

/* ---------- data ---------- */
async function loadOwner(o) {
  try {
    // chrome-state.json = what the Chrome wrote to its folder (every ~5 min, then OneDrive sync); chrome-state-live.json = the same content a Chrome
    // connected to OneDrive uploads straight through Graph within seconds. Use whichever is newer.
    const [r, lv] = await Promise.all([readText(cfg.root + '/Profiles/' + o + '/chrome-state.json'), readText(cfg.root + '/Profiles/' + o + '/chrome-state-live.json').catch(() => null)]);
    let doc = JSON.parse(r.text), live = false;
    if (lv) { try { const d2 = JSON.parse(lv.text); if (Date.parse(d2.updatedAt) > Date.parse(doc.updatedAt || 0)) { doc = d2; live = true; } } catch (e) {} }
    state[o] = { doc, at: Date.now(), err: null, live };
    LS.set('co.state.' + o, { doc, at: Date.now() });
  } catch (e) { state[o] = Object.assign(state[o] || {}, { err: describe(e) }); }
}
function extract(txt) {
  const d = JSON.parse(txt.replace(/^﻿/, ''));
  const p = Object.values(d.automationProfiles || {})[0] || {};
  let host = ''; try { host = new URL(p.siteUrl).hostname.replace(/^www\./, ''); } catch (e) {}
  return { rule: p.scheduleRule || 'midnight', hrs: p.intervalHours || 24, auth: p.authMethod || 'credentials', host, notes: String(p.notes || '').slice(0, 140), steps: (p.recordedSteps || []).length > 0 ? 1 : 0, type: p.profileType || '' };
}
async function loadStatics(o) {
  const d = state[o] && state[o].doc; if (!d) return;
  const st = statics[o];
  const todo = Object.values(d.profiles || {}).filter(p => p.hasRecording === undefined && !(st[p.file] && st[p.file].v === p.profileVersion) && !tried.has(o + '/' + p.file + '@' + p.profileVersion));
  if (!todo.length) return;
  let done = 0; progress = 'Loading ' + o + "'s profile details 0/" + todo.length; render();
  const q = todo.slice();
  async function worker() {
    while (q.length) {
      const p = q.shift(); tried.add(o + '/' + p.file + '@' + p.profileVersion);
      try { const r = await readText(cfg.root + '/Profiles/' + o + '/' + p.file); st[p.file] = { v: p.profileVersion, s: extract(r.text) }; } catch (e) { /* retried on the next full reload */ }
      done++; progress = 'Loading ' + o + "'s profile details " + done + '/' + todo.length;
      if (done % 20 === 0) { LS.set('co.static.' + o, st); render(); }
    }
  }
  await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
  LS.set('co.static.' + o, st); progress = ''; render();
}
function rowsOf(o) {
  const d = state[o] && state[o].doc; if (!d) return [];
  const st = statics[o] || {};
  return Object.entries(d.profiles || {}).map(([id, p]) => {
    const fromFile = st[p.file] && st[p.file].v === p.profileVersion ? st[p.file].s : null;
    const s = p.hasRecording !== undefined
      ? { rule: p.scheduleRule || 'midnight', hrs: p.intervalHours || 24, auth: p.authMethod || 'credentials', host: p.siteHost || '', notes: p.notes || '', steps: p.hasRecording ? 1 : 0, type: p.profileType || '' }
      : fromFile;
    const a = (L, k) => (L || []).slice(0, 3).filter(e => e[k] != null).map(e => [e[k], e.gain || 0]);
    return Object.assign({ id, n: p.name, file: p.file, ver: p.profileVersion, en: p.enabled !== false ? 1 : 0, ord: p.order || 0, st: p.lastStatus || '', lastAt: p.lastRunAt, nextAt: p.nextRunAt,
      gc: a(p.gcLast3, 'gc'), sc: a(p.scLast3, 'sc'), why: p.softFailReason || '', rt: p.lastRunTime || '', pending: !s },
      s || { rule: 'midnight', hrs: 24, auth: 'credentials', host: '', notes: '', steps: 1, type: '' });
  });
}

/* ---------- Overview grid (same rules as the extension dashboard) ---------- */
const SECTIONS = [
  ['loading', '⏳ Details not read yet (schedule and login type)'],
  ['midnight', '🌙 Run Daily (3:00 AM Eastern) — executes in order'],
  ['24hours', '⏱ Run on Interval (After Last Success)'],
  ['manual', '🖐 Manual — never runs automatically'],
  ['notsignedup', '🚫 Not Signed Up — never runs automatically, run buttons disabled'],
  ['freespins', '🎰 Free Spins — tracked only'],
  ['inactive', '💤 Disabled / No Recording — not running']
];
const attentionRank = p => (!p.en) ? 2 : (p.st === 'Needs Attention' || p.st === 'Failed' || p.st === 'Stopped (hung)') ? 0 : p.st.indexOf('Soft Fail') === 0 ? 1 : 2;
const groupRank = p => (p.en && p.steps) ? 0 : p.en ? 1 : p.steps ? 2 : 3;
const isInactive = p => !p.steps || (!p.en && p.st !== 'Failed');
const isBroken = p => p.en && p.steps && attentionRank(p) < 2;
function sectionOf(p) { if (p.pending) return 'loading'; if (p.type === 'freeSpins') return 'freespins'; if (isInactive(p)) return 'inactive'; if (p.rule === 'manual') return 'manual'; if (p.rule === 'notSignedUp') return 'notsignedup'; return p.rule === '24hours' ? '24hours' : 'midnight'; }
const stCls = p => !p.steps ? 'st-none' : p.st === 'Success' ? 'st-success' : /^(Failed|Needs Attention|Success \(Unverified\))/.test(p.st) ? 'st-fail' : 'st-proc';
const stTxt = p => !p.steps ? '⚠ No Recording' : (p.st || 'No executions');
// same row colors as the extension Overview: no recording = yellow, last status Failed = pink, enabled scheduled profile that has not run today = light red, disabled = faded
const rowCls = p => {
  let c = !p.steps ? 'row-no-recording' : (p.st === 'Failed' ? 'row-failed' : '');
  if (!p.en && p.st !== 'Failed') c += ' row-disabled';

  const put = (path, buf) => g('/me/drive/root:' + enc(path) + ':/content?@microsoft.graph.conflictBehavior=replace', { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: buf });
  await put(bk, pubState.od.buf);                       // keep the OneDrive version first
  await put(PUB.od, unb64(pubState.gh.content));
}
function pubRender() {
  const el = $('pub'); el.hidden = !pubOpen; $('out').hidden = pubOpen; if (!pubOpen) return;
  const s = pubState, has = !!ghTok(); let status = '';
  if (has && s.od && s.gh) { const same = s.od.sha === s.gh.sha; status = same ? `<span class="st same">✓ Same on OneDrive and GitHub</span>` : `<span class="st diff">● Different</span>`;
    status += `<p>OneDrive: ${s.od.size.toLocaleString()} bytes, changed ${lastTxt(Date.parse(s.od.mtime))}<br>GitHub: ${s.gh.size.toLocaleString()} bytes</p>`; }
  el.innerHTML = `<h3>Publish to GitHub</h3><p>Pushes <code class="k">index.html</code> from OneDrive to <code class="k">${esc(PUB.repo)}</code> (${esc(PUB.branch)}). The live page updates about a minute later.</p>
  ${has ? '' : `<p><b>Paste your GitHub token</b> (the one limited to ${esc(PUB.repo)}, with Contents read and write). It is saved only in this browser on this device.</p><input type="password" id="ghtok" placeholder="github_pat_..." autocomplete="off" spellcheck="false"><button class="btn" id="pub-save">Save token</button>`}
  ${has ? status : ''}${s.busy ? '<p>Working...</p>' : ''}${s.msg ? `<p class="st same">${esc(s.msg)}</p>` : ''}${s.note ? `<p>${esc(s.note)}</p>` : ''}${s.err ? `<div class="err">${esc(s.err)}</div>` : ''}
  ${has ? `<div><button class="btn" id="pub-check" ${s.busy ? 'disabled' : ''}>Check</button><button class="btn" id="pub-push" ${s.busy || !s.od || s.od.sha === s.gh.sha ? 'disabled' : ''}>Push to GitHub</button><button class="btn alt" id="pub-pull" ${s.busy || !s.od || s.od.sha === s.gh.sha ? 'disabled' : ''}>Pull from GitHub</button><button class="btn alt" id="pub-forget">Forget token</button></div>` : ''}
  <p style="margin-top:10px">The token lives in this browser's storage for this site address, like the Microsoft sign-in does. Use "Forget token" on a shared device.</p>`;
}
document.addEventListener('click', async e => {
  if (e.target.closest('#btn-publish')) { pubOpen = !pubOpen; pubState.msg = pubState.err = pubState.note = ''; pubRender(); if (pubOpen && ghTok()) pubDo(async () => {}); return; }
  if (!e.target.closest('#pub')) return;
  if (e.target.closest('#pub-save')) { const v = ($('ghtok').value || '').trim(); if (v) { LS.set('co.ghToken', v); pubDo(async () => {}); } return; }
  if (e.target.closest('#pub-forget')) { LS.del('co.ghToken'); pubState = { msg: 'Token removed from this browser.', busy: false, od: null, gh: null, note: '' }; pubRender(); return; }
  if (e.target.closest('#pub-check')) { pubState.note = ''; pubDo(async () => {}); return; }
  if (e.target.closest('#pub-push')) { pubState.note = ''; pubDo(pubPush, 'Pushed. The live page updates in about a minute.'); return; }
  if (e.target.closest('#pub-pull')) { pubState.note = ''; if (confirm('Replace the OneDrive index.html with the GitHub version? The OneDrive copy is saved to the backups folder first.')) pubDo(pubPull, 'Pulled from GitHub. The old OneDrive copy is in the backups folder.'); return; }
});

/* ---------- start ---------- */
async function refreshAll(manual) {
  if (loading || !started) return; loading = true; if (manual) $('refreshed').textContent = 'refreshing…';
  await Promise.all(OWNERS.map(loadOwner)); lastRefresh = Date.now(); loading = false; render();
  await loadStatics(cur);
  for (const o of OWNERS) if (o !== cur) await loadStatics(o);
}
async function boot() {
  const h = (location.hash || '').slice(1).toLowerCase(), f = OWNERS.find(o => o.toLowerCase() === h); if (f) cur = f;
  if (!cfg.clientId) { showSetup(); return; }
  if (!window.msal) { showSetup('The Microsoft sign-in library did not load. Check your connection and reload.'); return; }
  pca = new msal.PublicClientApplication({ auth: { clientId: cfg.clientId, authority: 'https://login.microsoftonline.com/consumers', redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
  if (pca.initialize) await pca.initialize();
  try { const r = await pca.handleRedirectPromise(); if (r && r.account) pca.setActiveAccount(r.account); }
  catch (e) { showSetup('Sign-in failed: ' + (e.errorMessage || e.message)); return; }
  acct = pca.getActiveAccount() || pca.getAllAccounts()[0] || null;
  if (acct) pca.setActiveAccount(acct); else { showSignIn(); return; }
  started = true; render();
  await refreshAll();
  setInterval(() => { if (document.visibilityState === 'visible') refreshAll(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 30000) refreshAll(); });
}
try { matchMedia('(max-width: 700px)').addEventListener('change', () => { if (!LS.get('co.view', null)) render(); }); } catch (e) {}
boot();
</script>
